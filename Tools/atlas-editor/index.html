<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTreeTool Atlas Editor</title>
    <link rel="stylesheet" href="./atlas-editor.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <strong>图鉴编辑工具</strong>
          <span id="status-line">未导入文件</span>
        </div>
        <div class="file-actions">
          <button id="reload-files" class="btn electron-only" type="button">重载磁盘</button>
          <button id="save-all-files" class="btn electron-only" type="button">保存全部</button>
          <button id="open-atlas-dir" class="btn electron-only" type="button">打开目录</button>
          <label class="btn file-btn browser-only">
            导入 nodes.json
            <input id="nodes-file" type="file" accept="application/json,.json" />
          </label>
          <label class="btn file-btn browser-only">
            导入 variables.json
            <input id="variables-file" type="file" accept="application/json,.json" />
          </label>
          <button id="export-nodes" class="btn primary browser-only" type="button">导出 nodes</button>
          <button id="export-variables" class="btn browser-only" type="button">导出 variables</button>
          <button id="export-all" class="btn browser-only" type="button">导出全部</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar">
          <div class="tabs" role="tablist" aria-label="Atlas editor sections">
            <button class="tab is-active" type="button" data-view="nodes">节点</button>
            <button class="tab" type="button" data-view="variables">变量</button>
            <button class="tab" type="button" data-view="audit">审计</button>
          </div>
          <div id="node-tools" class="sidebar-tools">
            <input id="node-search" class="search" type="search" placeholder="搜索节点 / 部门 / 负责人" />
            <select id="node-filter" class="select" aria-label="节点筛选">
              <option value="all">全部节点</option>
              <option value="missing">缺少人工字段</option>
              <option value="unknownType">含未知参数类型</option>
              <option value="hasVariables">引用变量</option>
            </select>
            <button id="add-node" class="btn full" type="button">新增节点</button>
          </div>
          <div id="variable-tools" class="sidebar-tools hidden">
            <input id="variable-search" class="search" type="search" placeholder="搜索变量" />
            <button id="add-variable" class="btn full" type="button">新增变量</button>
          </div>
          <div id="audit-tools" class="sidebar-tools hidden">
            <div class="summary-card">
              <span>编辑检查</span>
              <strong>审计</strong>
            </div>
          </div>
          <div id="item-list" class="item-list"></div>
        </aside>

        <section class="editor-panel">
          <div id="empty-state" class="empty-state">
            <strong>导入图鉴 JSON 后开始编辑</strong>
            <span>nodes / variables 可以分别导入和导出。</span>
          </div>

          <section id="node-preview" class="atlas-preview hidden">
            <div class="atlas-preview-main">
              <div class="atlas-preview-toolbar">
                <div>
                  <strong id="preview-title">节点图鉴</strong>
                  <span id="preview-summary">实时预览当前节点。</span>
                </div>
                <div class="segmented">
                  <button id="preview-mode-node" class="segment is-active" type="button">节点样式</button>
                  <button id="preview-mode-usage" class="segment" type="button">使用流程</button>
                </div>
              </div>
              <div id="preview-canvas" class="atlas-canvas"></div>
            </div>
          </section>

          <section id="audit-panel" class="audit-panel hidden">
            <section class="summary-card">
              <span>节点</span>
              <strong id="node-count">0</strong>
            </section>
            <section class="summary-card">
              <span>变量</span>
              <strong id="variable-count">0</strong>
            </section>
            <section class="summary-card">
              <span>检查</span>
              <strong id="issue-count">0</strong>
            </section>
            <section class="issue-panel">
              <strong>问题列表</strong>
              <div id="issue-list" class="issue-list"></div>
            </section>
          </section>
        </section>

        <div id="edit-pane-resizer" class="panel-resizer" role="separator" aria-label="调整编辑面板宽度" aria-orientation="vertical" tabindex="0"></div>

        <aside class="edit-pane">
          <form id="node-form" class="editor-form hidden">
            <div class="form-header">
              <div>
                <label class="field-label" for="node-key">节点 ID</label>
                <input id="node-key" class="input mono" type="text" spellcheck="false" />
              </div>
              <div class="header-actions">
                <button id="rename-node" class="btn primary" type="button">保存</button>
                <button id="delete-node" class="btn danger" type="button">删除节点</button>
              </div>
            </div>

            <div class="node-form-layout">
              <section class="node-basic-column">
                <div class="node-column-header">
                  <strong>基础信息</strong>
                </div>
                <div class="node-basic-scroll">
                  <div class="grid two">
                    <label class="field">
                      <span class="field-label">中文名</span>
                      <input id="node-title" class="input" type="text" />
                    </label>
                    <label class="field">
                      <span class="field-label">分类</span>
                      <select id="node-category" class="input">
                        <option>Action</option>
                        <option>Condition</option>
                        <option>Control</option>
                        <option>Decorator</option>
                        <option>SubTree</option>
                        <option>Info</option>
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">部门</span>
                      <input id="node-department" class="input" type="text" />
                    </label>
                    <label class="field">
                      <span class="field-label">负责人</span>
                      <input id="node-maintainer" class="input" type="text" />
                    </label>
                  </div>

                  <label class="field">
                    <span class="field-label">描述</span>
                    <textarea id="node-description" class="textarea" rows="4"></textarea>
                  </label>

                  <div class="grid three">
                    <label class="field">
                      <span class="field-label">状态</span>
                      <select id="node-status" class="input">
                        <option value="draft">draft</option>
                        <option value="stable">stable</option>
                        <option value="deprecated">deprecated</option>
                      </select>
                    </label>
                    <label class="field">
                      <span class="field-label">规则</span>
                      <textarea id="node-rules" class="textarea compact" rows="5"></textarea>
                    </label>
                    <label class="field">
                      <span class="field-label">示例</span>
                      <textarea id="node-examples" class="textarea compact" rows="5"></textarea>
                    </label>
                  </div>

                  <label class="field">
                    <span class="field-label">来源备注</span>
                    <textarea id="node-source-notes" class="textarea compact" rows="3"></textarea>
                  </label>

                  <section class="section-block usage-flow-editor">
                    <div class="section-title-row">
                      <strong>使用流程</strong>
                      <button id="add-usage-flow-root" class="btn small" type="button">初始化流程</button>
                    </div>
                    <div class="usage-flow-hint">编辑这里会同步中间的“使用流程”预览，并保存为 atlas usageFlows。</div>
                    <div id="usage-flow-editor" class="usage-flow-editor-body"></div>
                    <details class="usage-flow-json-details">
                      <summary>查看结构化 JSON</summary>
                      <textarea id="node-usage-flows" class="textarea mono" rows="6" spellcheck="false"></textarea>
                    </details>
                  </section>

                  <section class="section-block param-index-section">
                    <div class="section-title-row">
                      <strong>参数</strong>
                      <button id="add-param" class="btn small" type="button">新增参数</button>
                    </div>
                    <div id="param-index" class="param-index"></div>
                    <div id="param-editor" class="param-card-pool" hidden></div>
                  </section>
                </div>
              </section>

              <section class="node-param-column">
                <div class="section-title-row">
                  <strong>参数信息</strong>
                  <span id="param-detail-title" class="param-detail-title">未选择参数</span>
                </div>
                <div id="param-detail" class="param-detail"></div>
                <div id="param-detail-empty" class="param-detail-empty">选择左侧参数后编辑详细信息。</div>
              </section>
            </div>
          </form>

          <form id="variable-form" class="editor-form hidden">
            <div class="form-header">
              <div>
                <label class="field-label" for="variable-key">变量 key</label>
                <input id="variable-key" class="input mono" type="text" spellcheck="false" />
              </div>
              <div class="header-actions">
                <button id="rename-variable" class="btn primary" type="button">保存</button>
                <button id="delete-variable" class="btn danger" type="button">删除变量</button>
              </div>
            </div>

            <div class="grid two">
              <label class="field">
                <span class="field-label">标题</span>
                <input id="variable-title" class="input" type="text" />
              </label>
              <label class="field">
                <span class="field-label">类型</span>
                <input id="variable-type" class="input" type="text" />
              </label>
              <label class="field">
                <span class="field-label">单位</span>
                <input id="variable-unit" class="input" type="text" />
              </label>
              <label class="field">
                <span class="field-label">来源</span>
                <input id="variable-source" class="input" type="text" />
              </label>
            </div>

            <label class="field">
              <span class="field-label">说明</span>
              <textarea id="variable-description" class="textarea" rows="5"></textarea>
            </label>
            <div class="grid two">
              <label class="field">
                <span class="field-label">常见节点</span>
                <textarea id="variable-common-nodes" class="textarea compact" rows="6"></textarea>
              </label>
              <label class="field">
                <span class="field-label">示例</span>
                <textarea id="variable-examples" class="textarea compact" rows="6"></textarea>
              </label>
            </div>
          </form>

        </aside>
      </section>
    </main>

    <template id="param-template">
      <article class="param-card">
        <div class="param-header">
          <label class="field">
            <span class="field-label">参数名</span>
            <input class="input mono param-name" type="text" placeholder="例如 errorMsg" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label">默认/示例值</span>
            <input class="input param-default" type="text" list="variable-default-options" />
            <span class="field-help param-variable-help">使用 {变量名} 时会引用变量库里的类型和说明；引用后请到“变量”页修改。</span>
            <span class="field-help">用于图鉴预览。留空时会使用 {参数名} 作为占位。</span>
          </label>
          <label class="field">
            <span class="field-label">参数方向</span>
            <select class="input param-role">
              <option value="input">input - 节点读取</option>
              <option value="output">output - 节点写出</option>
              <option value="inout">inout - 读写</option>
              <option value="param">param - 配置项</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">参数类型</span>
            <input class="input param-type" type="text" placeholder="bool / int / double / string；unknown 表示待补充" />
            <span class="field-help param-type-help">unknown 表示当前图鉴还不知道这个参数的数据类型，需要人工补充。</span>
          </label>
          <label class="check field-check">
            <input class="param-required" type="checkbox" />
            <span>必填参数</span>
          </label>
          <button class="btn small danger param-remove" type="button">删除</button>
        </div>
        <label class="field">
          <span class="field-label">参数说明</span>
          <textarea class="textarea compact param-description" rows="3"></textarea>
          <span class="field-help param-description-help">说明这个参数的用途、取值含义、单位或限制。</span>
        </label>
      </article>
    </template>

    <datalist id="variable-default-options"></datalist>

    <script src="./atlas-editor.js"></script>
  </body>
</html>
